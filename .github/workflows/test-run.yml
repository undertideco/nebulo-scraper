name: Test Run

on:
  push:
    branches:
      - master

jobs:
  test-run:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'master'
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
      - run: go test ./...
      - uses: actions/cache@v6
        with:
          path: .cache/geocode/nebulo-scraper-geocode-cache.json
          key: geocode-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            geocode-cache-${{ runner.os }}-
      - name: Scrape
        run: go run ./cmd/nebulo-scraper -strict -geocode-cache .cache/geocode/nebulo-scraper-geocode-cache.json
        env:
          AIRNOW_KEY: ${{ secrets.AIRNOW_KEY }}
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
          GOOGLE_GEOCODING_API_KEY: ${{ secrets.GOOGLE_GEOCODING_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: output/
          retention-days: 7
